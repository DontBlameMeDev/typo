name: Bug Report
description: File a bug report
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run '...'
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Android version, device, app version, and selected folder location.
        For development issues, include the host OS and JavaScript tool versions.
      placeholder: |
        - Android: 17
        - Device: emulator or phone model
        - App version: 0.1.0
        - Folder: Internal storage/Documents/notes
        - Syncthing: enabled or disabled
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Output
      description: Copy and paste any relevant output or logs
      render: shell
    validations:
      required: false
