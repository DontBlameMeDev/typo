name: Startup

on:
  pull_request:
    paths:
      - App.tsx
      - index.ts
      - app.json
      - src/**
      - assets/**
      - scripts/startup*.ts
      - scripts/android.ts
      - .github/workflows/startup.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: startup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cold start is measured on a release build on an emulator. The probe only
# exists when EXPO_PUBLIC_TYPO_STARTUP is set, so release builds stay quiet.
jobs:
  measure:
    name: Measure cold start
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_TYPO_STARTUP: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: ./.github/actions/setup

      - run: bun run build:web

      - run: bunx expo prebuild -p android --clean

      - name: Build probe APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain

      # The emulator runner silently falls back to full software emulation
      # without this rule, which turns a one minute boot into ten.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Gradle daemon holds a gigabyte or two, and the emulator needs the
      # cores and memory more than the build cache does.
      - name: Stop the Gradle daemon
        working-directory: android
        run: ./gradlew --stop

      - name: Measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-snapshot -no-window -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            mkdir -p "$GITHUB_WORKSPACE/startup"
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            bun scripts/startup-seed.ts --notes 200
            bun scripts/startup.ts --runs 7 --json "$GITHUB_WORKSPACE/startup/head.json"

      - uses: actions/upload-artifact@v6
        with:
          name: startup
          path: startup/head.json
          retention-days: 30

  report:
    name: Report cold start
    needs: measure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v6
        with:
          name: startup
          path: startup

      - name: Fetch floor
        run: |
          floor="$RUNNER_TEMP/startup-floor.json"
          if git fetch --depth=1 origin startup-floor; then
            git show FETCH_HEAD:.github/startup-floor.json > "$floor"
          fi
          echo "FLOOR=$floor" >> "$GITHUB_ENV"

      - name: Compare
        run: >-
          bun scripts/startup-report.ts
          --head startup/head.json
          --floor "$FLOOR"
          --comment startup/comment.md
          --result startup/result.txt

      - name: Update comment
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: startup/comment.md
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync(process.env.COMMENT_PATH)) return
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            const marker = '<!-- startup-report -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot')
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Publish check
        uses: actions/github-script@v8
        env:
          RESULT_PATH: startup/result.txt
          COMMENT_PATH: startup/comment.md
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs')
            const result = fs.existsSync(process.env.RESULT_PATH)
              ? fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim()
              : 'fail'
            const summary = fs.existsSync(process.env.COMMENT_PATH)
              ? fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
              : 'No startup report was produced.'
            const conclusion = result === 'fail' ? 'failure' : result === 'ok' ? 'success' : 'neutral'
            const title = result === 'fail'
              ? 'Cold start regressed'
              : result === 'ok'
                ? 'Cold start within the floor'
                : 'Cold start floor pending'
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Startup audit',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              output: { title, summary },
            })

  floor:
    name: Record startup floor
    needs: measure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v6
        with:
          name: startup
          path: startup

      - name: Update floor
        env:
          BRANCH: startup-floor
          SHA: ${{ github.sha }}
        run: |
          bun scripts/startup-report.ts --head startup/head.json --record "$RUNNER_TEMP/startup-floor.json" --sha "$SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          worktree="$RUNNER_TEMP/floor"
          if git fetch --depth=1 origin "$BRANCH"; then
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            git worktree add --detach "$worktree" origin/main
          fi
          mkdir -p "$worktree/.github"
          cp "$RUNNER_TEMP/startup-floor.json" "$worktree/.github/startup-floor.json"
          git -C "$worktree" add .github/startup-floor.json
          git -C "$worktree" diff --cached --quiet && exit 0
          git -C "$worktree" commit -m "ci: record the startup floor"
          git -C "$worktree" push origin "HEAD:refs/heads/$BRANCH"
