name: Startup

on:
  pull_request:
    paths:
      - App.tsx
      - index.ts
      - app.json
      - src/**
      - assets/**
      - scripts/startup*.ts
      - scripts/android.ts
      - .github/workflows/startup.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: startup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cold start is measured on a release build on an emulator. The probe only
# exists when EXPO_PUBLIC_TYPO_STARTUP is set, so release builds stay quiet.
jobs:
  measure:
    name: Measure cold start
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_TYPO_STARTUP: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: ./.github/actions/setup

      - run: bun run build:web

      - run: bunx expo prebuild -p android --clean

      - name: Build probe APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain

      # The emulator runner silently falls back to full software emulation
      # without this rule, which turns a one minute boot into ten.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Gradle daemon holds a gigabyte or two, and the emulator needs the
      # cores and memory more than the build cache does.
      - name: Stop the Gradle daemon
        working-directory: android
        run: ./gradlew --stop

      - name: Measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-snapshot -no-window -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            mkdir -p "$GITHUB_WORKSPACE/startup"
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            bun scripts/startup-seed.ts --notes 200
            bun scripts/startup.ts --runs 7 --json "$GITHUB_WORKSPACE/startup/head.json"

      - uses: actions/upload-artifact@v6
        with:
          name: startup
          path: startup/head.json
          retention-days: 30
