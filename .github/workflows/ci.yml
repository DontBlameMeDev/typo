name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Check out the PR head so coverage line numbers match the diff.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup

      - run: bun run typecheck

      - run: bun run lint

      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - run: bun scripts/cobertura.ts

      - name: Baseline coverage
        if: github.event_name == 'pull_request'
        env:
          BASELINE_DIR: ${{ runner.temp }}/coverage-baseline
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$BASELINE_DIR" FETCH_HEAD
          ln -s "$PWD/node_modules" "$BASELINE_DIR/node_modules"
          cd "$BASELINE_DIR"
          bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
          bun scripts/cobertura.ts
          echo "BASELINE_COVERAGE=$BASELINE_DIR/coverage/cobertura.xml" >> "$GITHUB_ENV"
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check coverage
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/coverage-check.ts coverage/cobertura.xml 80 coverage/comment.md

      - name: Comment coverage
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync('coverage/comment.md')) return
            const body = fs.readFileSync('coverage/comment.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const marker = '<!-- coverage-report -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot'
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  performance:
    name: Performance
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RUN_KIND: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
    steps:
      # pull_request checks out the merge commit, so base-only changes are
      # included in the PR measurement.
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # The floors live on their own branch so no contributor can move them in a PR.
      - name: Plan variants
        run: |
          mkdir -p performance/raw
          floor="$RUNNER_TEMP/performance-floor.json"
          if git fetch --depth=1 origin floors; then
            git show FETCH_HEAD:.github/performance-floor.json > "$floor" || rm -f "$floor"
          fi
          node .github/scripts/performance-floor.cjs plan \
            --floor "$floor" \
            --head "$(git rev-parse HEAD)" \
            --base "$BASE_SHA" \
            --kind "$RUN_KIND" \
            --meta performance/meta.json > "$RUNNER_TEMP/variant-shas.txt"

      - name: Prepare variants
        run: |
          : > "$RUNNER_TEMP/variant-dirs.txt"
          while read -r sha; do
            [ -n "$sha" ] || continue
            dir="$RUNNER_TEMP/variants/$sha"
            git fetch --depth=1 origin "$sha"
            git worktree add --detach "$dir" FETCH_HEAD
            (cd "$dir" && bun install --frozen-lockfile)
            printf '%s %s\n' "$sha" "$dir" >> "$RUNNER_TEMP/variant-dirs.txt"
          done < "$RUNNER_TEMP/variant-shas.txt"

      # Every commit is measured in the same session, so runner speed cancels out.
      - name: Measure
        run: |
          head="$(git rev-parse HEAD)"
          for run in 1 2 3; do
            bun scripts/benchmark.ts --json > "performance/raw/$head-$run.json"
            while read -r sha dir; do
              (cd "$dir" && bun scripts/benchmark.ts --json > "$GITHUB_WORKSPACE/performance/raw/$sha-$run.json")
            done < "$RUNNER_TEMP/variant-dirs.txt"
          done
          bun scripts/performance-aggregate.ts performance/raw performance 3
          # Publishers on the default branch still read the pr.json and base.json names.
          if [ "$RUN_KIND" = "pull_request" ]; then
            cp "performance/$head.json" performance/pr.json
            cp "performance/$BASE_SHA.json" performance/base.json
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: performance
          path: performance/*.json
          retention-days: 30
