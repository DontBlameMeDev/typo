name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  apk:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'build-android')
    # Skipped review events must not cancel a requested APK build.
    concurrency:
      group: android-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPO_PUBLIC_TYPO_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      SIGNED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      # pull_request_review checks out the PR merge commit, so local actions
      # and the workflow itself come from main.
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: ./.github/actions/setup

      - run: bun run build:web

      - run: bunx expo prebuild -p android --clean

      - name: Build APK
        working-directory: android
        run: |
          if [ "$SIGNED" = "true" ]; then
            sed -i '/signingConfig signingConfigs.debug/d' app/build.gradle
          fi
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64

      # The keystore is only available to this step, not the build steps.
      - name: Sign APK
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Main builds need the release keystore secrets." >&2
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/typo.apk" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/apksigner" verify --print-certs "$RUNNER_TEMP/typo.apk" | head -2

      - name: Use debug-signed APK
        if: env.SIGNED != 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/typo.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: typo-android-${{ env.REF_SHA }}
          path: ${{ runner.temp }}/typo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          echo "Installable APK for this commit: **\`typo-android-${{ env.REF_SHA }}\`**" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
