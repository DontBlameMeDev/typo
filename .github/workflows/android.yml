name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wasm-opt
        run: |
          version=133
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/binaryen-version_${version}/bin/wasm-opt" /usr/local/bin/
          wasm-opt --version

      - run: bun install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # The generated Android project signs release builds with the debug
      # keystore. Keep it stable so installs upgrade instead of failing on a
      # signature mismatch.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - run: bun run build:web

      - run: bunx expo prebuild -p android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: typo-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          echo "Installable APK for this commit: **\`typo-android-${{ github.sha }}\`**" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
