name: Android

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]

# Only the newest build per branch or pull request survives. Pushing ten
# commits in a row cancels the earlier runs instead of queueing ten APKs.
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    if: github.event_name == 'push' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # pull_request_review checks out the PR merge commit, so local actions
      # and the workflow itself come from main.
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: ./.github/actions/setup

      # The generated Android project signs release builds with the debug
      # keystore. Keep it stable so installs upgrade instead of failing on a
      # signature mismatch.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - run: bun run build:web

      - run: bunx expo prebuild -p android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: typo-android-${{ env.REF_SHA }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          echo "Installable APK for this commit: **\`typo-android-${{ env.REF_SHA }}\`**" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
