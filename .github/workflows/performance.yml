name: Performance

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  report:
    name: Publish performance report
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: performance-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: true
    steps:
      # workflow_run has a write-capable token even for fork PRs. Only load the
      # publisher from the default branch and never execute PR code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - run: node --test .github/scripts/performance-report.test.cjs

      - id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run
            const pr = run.pull_requests[0]
            if (!pr) return core.notice('No pull request for this run.')
            core.setOutput('publish', 'true')
            core.setOutput('number', pr.number)
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('pr_run_id', run.id)
            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            })
            core.setOutput('pr_artifact', artifactData.artifacts.some((artifact) => artifact.name === 'performance' && !artifact.expired))


      - name: Download PR measurement
        if: steps.resolve.outputs.publish == 'true' && steps.resolve.outputs.pr_artifact == 'true'
        uses: actions/download-artifact@v6
        with:
          name: performance
          path: ${{ runner.temp }}/performance
          run-id: ${{ steps.resolve.outputs.pr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare measurements
        if: steps.resolve.outputs.publish == 'true'
        env:
          PR_SHA: ${{ steps.resolve.outputs.head_sha }}
          PR_RUN: ${{ steps.resolve.outputs.pr_run_id }}
          PR_ARTIFACT: ${{ steps.resolve.outputs.pr_artifact }}
          RESULT_DIR: ${{ runner.temp }}/performance
        run: |
          mkdir -p "$RESULT_DIR"
          if [ "$PR_ARTIFACT" != "true" ]; then
            printf '<!-- performance-report -->\n### Performance audit\n\nNo performance measurement was uploaded for this run.\n' > "$RESULT_DIR/comment.md"
            printf 'fail\n' > "$RESULT_DIR/result.txt"
            exit 0
          fi
          base_sha="$(node -p "require('$RESULT_DIR/meta.json').baseSha")"
          node .github/scripts/performance-report.cjs \
            --pr "$RESULT_DIR/pr.json" \
            --base "$RESULT_DIR/base.json" \
            --out "$RESULT_DIR/comment.md" \
            --result "$RESULT_DIR/result.txt" \
            --pr-sha "$PR_SHA" \
            --base-sha "$base_sha"

      - name: Update comment
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ runner.temp }}/performance/comment.md
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync(process.env.COMMENT_PATH)) return
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            const marker = '<!-- performance-report -->'
            const { owner, repo } = context.repo
            const issue_number = Number('${{ steps.resolve.outputs.number }}')
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot')
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Publish check
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/performance/result.txt
          COMMENT_PATH: ${{ runner.temp }}/performance/comment.md
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs')
            const result = fs.existsSync(process.env.RESULT_PATH)
              ? fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim()
              : 'pending'
            const summary = fs.existsSync(process.env.COMMENT_PATH)
              ? fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
              : 'No performance report was produced.'
            const conclusion = result === 'fail' ? 'failure' : result === 'pass' ? 'success' : 'neutral'
            const title = result === 'fail' ? 'Performance audit failed' : result === 'pass' ? 'Performance within limits' : 'Performance baseline pending'
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Performance audit',
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                conclusion,
                output: { title, summary },
              })
            } catch (error) {
              core.warning(`Cannot publish the performance check: ${error.message}`)
            }
