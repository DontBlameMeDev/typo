name: Performance

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  report:
    name: Publish performance report
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    concurrency:
      group: performance-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: true
    steps:
      # workflow_run has a write-capable token even for fork PRs. Only load the
      # publisher from the default branch and never execute PR code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - run: node --test .github/scripts/*.test.cjs

      - id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run
            const pr = run.pull_requests[0]
            if (!pr) return core.notice('No pull request for this run.')
            core.setOutput('publish', 'true')
            core.setOutput('number', pr.number)
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('pr_run_id', run.id)
            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            })
            core.setOutput('pr_artifact', artifactData.artifacts.some((artifact) => artifact.name === 'performance' && !artifact.expired))

      - name: Download PR measurement
        if: steps.resolve.outputs.publish == 'true' && steps.resolve.outputs.pr_artifact == 'true'
        uses: actions/download-artifact@v6
        with:
          name: performance
          path: ${{ runner.temp }}/performance
          run-id: ${{ steps.resolve.outputs.pr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare measurements
        if: steps.resolve.outputs.publish == 'true'
        env:
          PR_ARTIFACT: ${{ steps.resolve.outputs.pr_artifact }}
          RESULT_DIR: ${{ runner.temp }}/performance
        run: |
          mkdir -p "$RESULT_DIR"
          if [ "$PR_ARTIFACT" != "true" ]; then
            printf '<!-- performance-report -->\n### Performance audit\n\nNo performance measurement was uploaded for this run.\n' > "$RESULT_DIR/comment.md"
            printf 'fail\n' > "$RESULT_DIR/result.txt"
            exit 0
          fi
          if ! node .github/scripts/performance-report.cjs \
            --dir "$RESULT_DIR" \
            --out "$RESULT_DIR/comment.md" \
            --result "$RESULT_DIR/result.txt"; then
            printf '<!-- performance-report -->\n### Performance audit\n\nThe comparison failed. Check the workflow logs.\n' > "$RESULT_DIR/comment.md"
            printf 'fail\n' > "$RESULT_DIR/result.txt"
            exit 1
          fi

      - name: Update comment
        if: always() && steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ runner.temp }}/performance/comment.md
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync(process.env.COMMENT_PATH)) return
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            const marker = '<!-- performance-report -->'
            const { owner, repo } = context.repo
            const issue_number = Number('${{ steps.resolve.outputs.number }}')
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot')
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Publish check
        if: always() && steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/performance/result.txt
          COMMENT_PATH: ${{ runner.temp }}/performance/comment.md
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs')
            const hasResult = fs.existsSync(process.env.RESULT_PATH)
            const result = hasResult
              ? fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim()
              : 'pending'
            const summary = fs.existsSync(process.env.COMMENT_PATH)
              ? fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
              : 'No performance report was produced.'
            const conclusion = !hasResult || result === 'fail' ? 'failure' : result === 'pass' ? 'success' : 'neutral'
            const title = !hasResult
              ? 'Performance result missing'
              : result === 'fail'
                ? 'Performance audit failed'
                : result === 'pass'
                  ? 'Performance within limits'
                  : 'Performance baseline pending'
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Performance audit',
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                conclusion,
                output: { title, summary },
              })
            } catch (error) {
              core.warning(`Cannot publish the performance check: ${error.message}`)
            }

  ceiling:
    name: Record performance ceiling
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: performance-ceiling
      cancel-in-progress: false
    steps:
      # Scripts always come from the default branch, never from the measured commit.
      - uses: actions/checkout@v5

      - run: node --test .github/scripts/*.test.cjs

      - name: Download main measurement
        uses: actions/download-artifact@v6
        with:
          name: performance
          path: ${{ runner.temp }}/performance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ceiling
        env:
          RESULT_DIR: ${{ runner.temp }}/performance
          BRANCH: performance-floor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          worktree="$RUNNER_TEMP/ceiling"
          if git fetch --depth=1 origin "$BRANCH"; then
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            git worktree add --detach "$worktree" origin/main
          fi
          floor="$worktree/.github/performance-floor.json"
          node .github/scripts/performance-floor.cjs update \
            --floor "$floor" \
            --meta "$RESULT_DIR/meta.json" \
            --dir "$RESULT_DIR" \
            --out "$floor" \
            --marker "$RUNNER_TEMP/ceiling-changed.txt"
          if [ "$(cat "$RUNNER_TEMP/ceiling-changed.txt")" != "changed" ]; then
            exit 0
          fi
          git -C "$worktree" add .github/performance-floor.json
          git -C "$worktree" commit -m "ci: lower the performance ceiling"
          git -C "$worktree" push origin "HEAD:refs/heads/$BRANCH"
