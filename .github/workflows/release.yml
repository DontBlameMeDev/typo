name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# A release pushes to main and publishes one tag, so two runs cannot overlap.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run the Release workflow from main." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The main ruleset requires pull requests and lets deploy keys bypass it.
      - name: Use deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/release"
          chmod 600 "$HOME/.ssh/release"
          git config core.sshCommand "ssh -i $HOME/.ssh/release -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(node -p 'require("./app.json").expo.version')
          code=$(node -p 'require("./app.json").expo.android.versionCode')
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          latest=${latest#v}

          if [ -z "$latest" ] || [ "$latest" = "$current" ]; then
            IFS=. read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="$major.$minor.$patch"
            code=$((code + 1))
            node -e '
              const fs = require("node:fs")
              const [version, code] = process.argv.slice(1)
              const file = "app.json"
              const source = fs.readFileSync(file, "utf8")
              const next = source
                .replace(/("version": ")[^"]+(")/, (_, before, after) => before + version + after)
                .replace(/("versionCode": )\d+/, (_, before) => before + code)
              if (next === source) throw new Error("app.json did not change")
              fs.writeFileSync(file, next)
            ' "$version" "$code"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore(release): $version" \
              -m "Bump the app version to $version and the Android version code to $code."
          else
            # An earlier run pushed the bump but stopped before publishing.
            version="$current"
            echo "Resuming $version, already bumped on main."
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists." >&2
            exit 1
          fi

          git fetch origin main
          git rebase origin/main

          # The rebase can move main past the commit the version was read from.
          checked_version=$(node -p 'require("./app.json").expo.version')
          checked_code=$(node -p 'require("./app.json").expo.android.versionCode')
          if [ "$checked_version" != "$version" ] || [ "$checked_code" != "$code" ]; then
            echo "main changed the version to $checked_version ($checked_code). Run the release again." >&2
            exit 1
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
          fi

          {
            echo "version=$version"
            echo "code=$code"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          before=$(gh run list --workflow android.yml --event workflow_dispatch \
            --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run android.yml --ref main

          run=""
          for _ in $(seq 1 60); do
            run=$(gh run list --workflow android.yml --event workflow_dispatch \
              --branch main --limit 20 --json databaseId,headSha \
              --jq '[.[] | select(.databaseId > '"$before"' and .headSha == "'"$SHA"'")][0] // empty | "\(.databaseId) \(.headSha)"')
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "No Android workflow run started for $SHA." >&2
            exit 1
          fi

          run_id=${run%% *}
          gh run watch "$run_id" --exit-status --interval 30
          gh run download "$run_id" --name "typo-android-$SHA" --dir "$RUNNER_TEMP/apk"

      - name: Verify APK
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt2=$(find "$sdk/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if [ -z "$aapt2" ]; then
            echo "aapt2 was not found in $sdk/build-tools." >&2
            exit 1
          fi
          case "$("$aapt2" dump badging "$RUNNER_TEMP/apk/typo.apk")" in
            *"versionCode='$CODE'"*) ;;
            *) echo "The APK versionCode does not match $CODE." >&2; exit 1 ;;
          esac

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          apk="typo-$VERSION.apk"
          mv "$RUNNER_TEMP/apk/typo.apk" "$RUNNER_TEMP/$apk"

          args=(--target "$SHA" --title "$tag")
          if [ -f "docs/releases/$VERSION.md" ]; then
            args+=(--notes-file "docs/releases/$VERSION.md")
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "$RUNNER_TEMP/$apk" "${args[@]}"
          echo "Released **$tag** with \`$apk\`." >> "$GITHUB_STEP_SUMMARY"
