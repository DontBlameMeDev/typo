name: Audit

on:
  workflow_run:
    workflows: [CI, Startup]
    types: [completed]

permissions:
  contents: read

# Measurements run on pull request code. This workflow publishes their results
# and records the floors, so it always runs only default branch code.
jobs:
  performance-report:
    name: Publish performance report
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    concurrency:
      group: performance-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      # workflow_run has a write-capable token even for fork PRs. Only load the
      # publisher from the default branch and never execute PR code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - run: node --test .github/scripts/*.test.cjs

      - id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run
            // workflow_run.pull_requests is empty for fork pull requests.
            let pr = run.pull_requests[0]
            if (!pr && run.head_repository) {
              const { data: candidates } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100,
              })
              const matches = candidates.filter((candidate) => candidate.head.sha === run.head_sha)
              if (matches.length === 1) pr = matches[0]
            }
            if (!pr) return core.notice('No pull request for this run.')
            core.setOutput('publish', 'true')
            core.setOutput('number', pr.number)
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('pr_run_id', run.id)
            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            })
            core.setOutput('pr_artifact', artifactData.artifacts.some((artifact) => artifact.name === 'performance' && !artifact.expired))

      - name: Download PR measurement
        if: steps.resolve.outputs.publish == 'true' && steps.resolve.outputs.pr_artifact == 'true'
        uses: actions/download-artifact@v6
        with:
          name: performance
          path: ${{ runner.temp }}/performance
          run-id: ${{ steps.resolve.outputs.pr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare measurements
        if: steps.resolve.outputs.publish == 'true'
        env:
          PR_ARTIFACT: ${{ steps.resolve.outputs.pr_artifact }}
          RESULT_DIR: ${{ runner.temp }}/performance
        run: |
          mkdir -p "$RESULT_DIR"
          if [ "$PR_ARTIFACT" != "true" ]; then
            printf '<!-- performance-report -->\n### Performance audit\n\nNo performance measurement was uploaded for this run.\n' > "$RESULT_DIR/comment.md"
            printf 'fail\n' > "$RESULT_DIR/result.txt"
            exit 0
          fi
          if ! node .github/scripts/performance-report.cjs \
            --dir "$RESULT_DIR" \
            --out "$RESULT_DIR/comment.md" \
            --result "$RESULT_DIR/result.txt"; then
            printf '<!-- performance-report -->\n### Performance audit\n\nThe comparison failed. Check the workflow logs.\n' > "$RESULT_DIR/comment.md"
            printf 'fail\n' > "$RESULT_DIR/result.txt"
            exit 1
          fi

      - name: Update comment
        if: always() && steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ runner.temp }}/performance/comment.md
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync(process.env.COMMENT_PATH)) return
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            const marker = '<!-- performance-report -->'
            const { owner, repo } = context.repo
            const issue_number = Number('${{ steps.resolve.outputs.number }}')
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot')
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Publish check
        if: always() && steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/performance/result.txt
          COMMENT_PATH: ${{ runner.temp }}/performance/comment.md
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs')
            const hasResult = fs.existsSync(process.env.RESULT_PATH)
            const result = hasResult
              ? fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim()
              : 'pending'
            const summary = fs.existsSync(process.env.COMMENT_PATH)
              ? fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
              : 'No performance report was produced.'
            const conclusion = !hasResult || result === 'fail' ? 'failure' : result === 'pass' ? 'success' : 'neutral'
            const title = !hasResult
              ? 'Performance result missing'
              : result === 'fail'
                ? 'Performance audit failed'
                : result === 'pass'
                  ? 'Performance within limits'
                  : 'Performance baseline pending'
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Performance audit',
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                conclusion,
                output: { title, summary },
              })
            } catch (error) {
              core.warning(`Cannot publish the performance check: ${error.message}`)
            }

  startup-report:
    name: Publish startup report
    if: >-
      github.event.workflow_run.name == 'Startup' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    concurrency:
      group: startup-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      # Only load the publisher from the default branch and never execute PR code.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run
            // workflow_run.pull_requests is empty for fork pull requests.
            let pr = run.pull_requests[0]
            if (!pr && run.head_repository) {
              const { data: candidates } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100,
              })
              const matches = candidates.filter((candidate) => candidate.head.sha === run.head_sha)
              if (matches.length === 1) pr = matches[0]
            }
            if (!pr) return core.notice('No pull request for this run.')
            core.setOutput('publish', 'true')
            core.setOutput('number', pr.number)
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('pr_run_id', run.id)
            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            })
            core.setOutput('pr_artifact', artifactData.artifacts.some((artifact) => artifact.name === 'startup' && !artifact.expired))

      - name: Download PR measurement
        if: steps.resolve.outputs.publish == 'true' && steps.resolve.outputs.pr_artifact == 'true'
        uses: actions/download-artifact@v6
        with:
          name: startup
          path: ${{ runner.temp }}/startup
          run-id: ${{ steps.resolve.outputs.pr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare measurement
        if: steps.resolve.outputs.publish == 'true'
        env:
          PR_ARTIFACT: ${{ steps.resolve.outputs.pr_artifact }}
          RESULT_DIR: ${{ runner.temp }}/startup
        run: |
          mkdir -p "$RESULT_DIR"
          if [ "$PR_ARTIFACT" != "true" ]; then
            printf '<!-- startup-report -->\n### Startup audit\n\nNo startup measurement was uploaded for this run.\n' > "$RESULT_DIR/comment.md"
            printf 'fail\n' > "$RESULT_DIR/result.txt"
            exit 0
          fi
          floor="$RESULT_DIR/floor.json"
          if git fetch --depth=1 origin floors; then
            git show FETCH_HEAD:.github/startup-floor.json > "$floor" || rm -f "$floor"
          fi
          bun scripts/startup-report.ts \
            --head "$RESULT_DIR/head.json" \
            --floor "$floor" \
            --comment "$RESULT_DIR/comment.md" \
            --result "$RESULT_DIR/result.txt"

      - name: Update comment
        if: always() && steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ runner.temp }}/startup/comment.md
        with:
          script: |
            const fs = require('node:fs')
            if (!fs.existsSync(process.env.COMMENT_PATH)) return
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            const marker = '<!-- startup-report -->'
            const { owner, repo } = context.repo
            const issue_number = Number('${{ steps.resolve.outputs.number }}')
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((comment) => comment.body?.includes(marker) && comment.user?.type === 'Bot')
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Publish check
        if: always() && steps.resolve.outputs.publish == 'true'
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ runner.temp }}/startup/result.txt
          COMMENT_PATH: ${{ runner.temp }}/startup/comment.md
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        with:
          script: |
            const fs = require('node:fs')
            const result = fs.existsSync(process.env.RESULT_PATH)
              ? fs.readFileSync(process.env.RESULT_PATH, 'utf8').trim()
              : 'fail'
            const summary = fs.existsSync(process.env.COMMENT_PATH)
              ? fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
              : 'No startup report was produced.'
            const conclusion = result === 'fail' ? 'failure' : result === 'ok' ? 'success' : 'neutral'
            const title = result === 'fail'
              ? 'Cold start regressed'
              : result === 'ok'
                ? 'Cold start within the floor'
                : 'Cold start floor pending'
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Startup audit',
                head_sha: process.env.HEAD_SHA,
                status: 'completed',
                conclusion,
                output: { title, summary },
              })
            } catch (error) {
              core.warning(`Cannot publish the startup check: ${error.message}`)
            }

  performance-floor:
    name: Record performance ceiling
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    # Both floors are one commit chain, so only one recording job may push.
    concurrency:
      group: floors
      cancel-in-progress: false
    steps:
      # Scripts always come from the default branch, never from the measured commit.
      - uses: actions/checkout@v5

      - run: node --test .github/scripts/*.test.cjs

      - name: Download main measurement
        uses: actions/download-artifact@v6
        with:
          name: performance
          path: ${{ runner.temp }}/performance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ceiling
        env:
          RESULT_DIR: ${{ runner.temp }}/performance
          BRANCH: floors
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          worktree="$RUNNER_TEMP/ceiling"
          if git fetch --depth=1 origin "$BRANCH"; then
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            git worktree add --detach "$worktree" origin/main
          fi
          floor="$worktree/.github/performance-floor.json"
          node .github/scripts/performance-floor.cjs update \
            --floor "$floor" \
            --meta "$RESULT_DIR/meta.json" \
            --dir "$RESULT_DIR" \
            --out "$floor" \
            --marker "$RUNNER_TEMP/ceiling-changed.txt"
          if [ "$(cat "$RUNNER_TEMP/ceiling-changed.txt")" != "changed" ]; then
            exit 0
          fi
          git -C "$worktree" add .github/performance-floor.json
          git -C "$worktree" commit -m "ci: lower the performance ceiling"
          git -C "$worktree" push origin "HEAD:refs/heads/$BRANCH"

  startup-floor:
    name: Record startup floor
    if: >-
      github.event.workflow_run.name == 'Startup' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: floors
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download main measurement
        uses: actions/download-artifact@v6
        with:
          name: startup
          path: ${{ runner.temp }}/startup
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update floor
        env:
          RESULT_DIR: ${{ runner.temp }}/startup
          BRANCH: floors
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bun scripts/startup-report.ts --head "$RESULT_DIR/head.json" --record "$RUNNER_TEMP/startup-floor.json" --sha "$SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          worktree="$RUNNER_TEMP/floor"
          if git fetch --depth=1 origin "$BRANCH"; then
            git worktree add --detach "$worktree" FETCH_HEAD
          else
            git worktree add --detach "$worktree" origin/main
          fi
          mkdir -p "$worktree/.github"
          cp "$RUNNER_TEMP/startup-floor.json" "$worktree/.github/startup-floor.json"
          git -C "$worktree" add .github/startup-floor.json
          git -C "$worktree" diff --cached --quiet && exit 0
          git -C "$worktree" commit -m "ci: record the startup floor"
          git -C "$worktree" push origin "HEAD:refs/heads/$BRANCH"
