name: Setup
description: Install Bun, wasm-opt, and the project dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache Bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install wasm-opt
      shell: bash
      run: |
        version=133
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz" |
          tar -xz -C "$RUNNER_TEMP"
        sudo install "$RUNNER_TEMP/binaryen-version_${version}/bin/wasm-opt" /usr/local/bin/
        wasm-opt --version

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
